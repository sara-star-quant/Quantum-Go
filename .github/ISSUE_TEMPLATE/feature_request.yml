name: Feature request
description: Propose a change or an addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem you are solving
      description: What are you trying to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: API shape or behavior, and what it should not change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
