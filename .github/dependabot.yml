# Routine version updates, grouped weekly so they arrive as a few reviewable pull requests.
# Security updates are separate and stay enabled in the repository settings.
# The hash-locked ScanCode requirements are not listed: Dependabot cannot maintain a
# uv-compiled lock (it dropped hashes and rewrote extras), so regenerate it with the uv
# command documented in .github/workflows/license-scan.yml.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
