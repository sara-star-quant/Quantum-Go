name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  license-scan:
    name: License Scan
    uses: ./.github/workflows/license-scan.yml

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: license-scan
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'
        cache: true

    - name: Download license scan result
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: license-scan
        path: scan

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Run tests
      run: make test

    - name: Build release binaries
      env:
        VERSION: ${{ steps.get_version.outputs.VERSION }}
      run: make release

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
      with:
        subject-path: |
          bin/release/*.tar.gz
          bin/release/*.zip
          bin/release/checksums-sha256.txt

    - name: Install cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

    - name: Sign release artifacts
      run: |
        set -euo pipefail
        for f in bin/release/*.tar.gz bin/release/*.zip bin/release/checksums-sha256.txt; do
          cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
        done

    - name: Generate release notes
      env:
        VERSION: ${{ steps.get_version.outputs.VERSION }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        # Pull this version's section from CHANGELOG.md (the highlights for the release).
        notes=$(sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d')
        {
          echo "## Quantum-Go v$VERSION"
          echo
          if [ -n "$notes" ]; then echo "$notes"; else echo "See the [CHANGELOG](https://github.com/$REPO/blob/main/CHANGELOG.md)."; fi
          echo
          echo "### Installation"
          echo
          echo "Linux (amd64):"
          echo '```bash'
          echo "wget https://github.com/$REPO/releases/download/v$VERSION/quantum-tunnel-$VERSION-linux-amd64.tar.gz"
          echo "tar -xzf quantum-tunnel-$VERSION-linux-amd64.tar.gz"
          echo "sudo mv quantum-tunnel-linux-amd64 /usr/local/bin/quantum-tunnel"
          echo '```'
          echo
          echo "macOS (arm64): download \`quantum-tunnel-$VERSION-darwin-arm64.tar.gz\`. Windows (amd64): download \`quantum-tunnel-$VERSION-windows-amd64.zip\`."
          echo
          echo "### Verify checksums"
          echo '```bash'
          echo "shasum -a 256 -c checksums-sha256.txt"
          echo '```'
          echo
          echo "[Repository](https://github.com/$REPO) - [Security Policy](https://github.com/$REPO/blob/main/SECURITY.md) - [Protocol Spec](https://github.com/$REPO/blob/main/docs/PROTOCOL.md)"
        } > release_notes.md
        echo "--- generated release notes ---"; cat release_notes.md

    - name: Create Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        files: |
          bin/release/*.tar.gz
          bin/release/*.zip
          bin/release/checksums-sha256.txt
          bin/release/*.sigstore.json
          scan/scancode.json
        body_path: release_notes.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Compute lowercase image name
      run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Build and push Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: true
        tags: |
          ${{ env.IMAGE }}:${{ steps.get_version.outputs.VERSION }}
          ${{ env.IMAGE }}:latest
        platforms: linux/amd64,linux/arm64
