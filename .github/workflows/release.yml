name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  license-scan:
    name: License Scan
    uses: ./.github/workflows/license-scan.yml

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: license-scan
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: '1.26.x'
        cache: true

    - name: Download license scan result
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: license-scan
        path: scan

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Run tests
      run: make test

    - name: Build release binaries
      env:
        VERSION: ${{ steps.get_version.outputs.VERSION }}
      run: make release

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
      with:
        subject-path: |
          bin/release/*.tar.gz
          bin/release/*.zip
          bin/release/checksums-sha256.txt

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Sign release artifacts
      run: |
        set -euo pipefail
        for f in bin/release/*.tar.gz bin/release/*.zip bin/release/checksums-sha256.txt; do
          cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
        done

    - name: Generate release notes
      env:
        VERSION: ${{ steps.get_version.outputs.VERSION }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        # Pull this version's section from CHANGELOG.md (the highlights for the release).
        notes=$(sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d')
        {
          echo "## Quantum-Go v$VERSION"
          echo
          if [ -n "$notes" ]; then echo "$notes"; else echo "See the [CHANGELOG](https://github.com/$REPO/blob/main/CHANGELOG.md)."; fi
          echo
          echo "### Installation"
          echo
          echo "Linux (amd64):"
          echo '```bash'
          echo "wget https://github.com/$REPO/releases/download/v$VERSION/quantum-tunnel-$VERSION-linux-amd64.tar.gz"
          echo "tar -xzf quantum-tunnel-$VERSION-linux-amd64.tar.gz"
          echo "sudo mv quantum-tunnel-linux-amd64 /usr/local/bin/quantum-tunnel"
          echo '```'
          echo
          echo "macOS (arm64): download \`quantum-tunnel-$VERSION-darwin-arm64.tar.gz\`. Windows (amd64): download \`quantum-tunnel-$VERSION-windows-amd64.zip\`."
          echo
          echo "### Verify checksums"
          echo '```bash'
          echo "shasum -a 256 -c checksums-sha256.txt"
          echo '```'
          echo
          echo "[Repository](https://github.com/$REPO) - [Security Policy](https://github.com/$REPO/blob/main/SECURITY.md) - [Protocol Spec](https://github.com/$REPO/blob/main/docs/PROTOCOL.md)"
        } > release_notes.md
        echo "--- generated release notes ---"; cat release_notes.md

    - name: Create Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        files: |
          bin/release/*.tar.gz
          bin/release/*.zip
          bin/release/checksums-sha256.txt
          bin/release/*.sigstore.json
          scan/scancode.json
        body_path: release_notes.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Compute lowercase image name
      run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Build and push Docker image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        push: true
        tags: |
          ${{ env.IMAGE }}:${{ steps.get_version.outputs.VERSION }}
          ${{ env.IMAGE }}:latest
        platforms: linux/amd64,linux/arm64
