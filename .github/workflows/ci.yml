name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# A new push to a pull request cancels that PR's older run. Pushes to main key on the commit,
# not the branch: a shared group would replace a queued run with the next one when commits
# land minutes apart, leaving commits (a release tip included) without a finished run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only pull requests skip the heavy jobs. A skipped job reports as success to
  # branch protection, so no ruleset change is needed. README.md still counts as code
  # because the lint job checks its line-count claim. Static analysis (gosec, CodeQL)
  # is the exception and always runs, because OpenSSF Scorecard's SAST check counts the
  # recent commits that had an analysis run.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            other=$(git diff --name-only "$BASE_SHA" HEAD | grep -vE '^$|^(docs/|\.claude/)|^(CHANGELOG|ROADMAP|CONTRIBUTING|SECURITY|CODE_OF_CONDUCT)\.md$|^(LICENSE|NOTICE)$' || true)
            [ -n "$other" ] || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.26.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      # Race detection is platform independent, so run it once on Linux. Coverage runs in its
      # own job so the two overlap: together on 4 CPUs they took 458 s, apart 276 s and 118 s.
      # macOS and Windows run the plain suite to cover their own socket and file paths.
      - name: Run tests with the race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test ./... -race

      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: go test ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run tests with coverage
        # Coverage of the library (pkg and internal), credited by every test suite.
        run: go test ./... -coverpkg=./pkg/...,./internal/... -coverprofile=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-ubuntu-latest
          path: coverage.out
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Check the README line count
        run: scripts/loc.sh --check

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          args: --timeout=5m

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          check-latest: true # runner images lag on patch releases, and this job reports stdlib fixes
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  fips:
    name: FIPS Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: go vet
        run: |
          go vet ./...
          go vet -tags fips ./...

      - name: FIPS build
        run: go build -tags fips ./...

      - name: FIPS tests (race)
        run: go test -tags fips ./... -race

  fips-coverage:
    name: FIPS Coverage
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: FIPS tests with coverage
        run: go test -tags fips ./... -coverpkg=./pkg/...,./internal/... -coverprofile=coverage-fips.out

      - name: Upload FIPS coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: coverage-fips.out
          flags: fips
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            go-version: "1.26.x"
            bin: app
          - os: macos-latest
            go-version: "1.26.x"
            bin: app
          - os: windows-latest
            go-version: "1.26.x"
            bin: app.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      # Build a single package (.) into a single output file.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.bin }}" .

      - name: Upload Binaries
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: binaries-${{ matrix.os }}
          path: dist/
          retention-days: 14

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Docker image, whose bundled Go is too old to load a `go 1.26` module
      # (it errors on package load and exits non-zero, which -no-fail used to hide).
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.11

      - name: Run Gosec Security Scanner
        run: gosec -fmt sarif -out gosec.sarif ./...

      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: gosec.sarif

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: security-report
          path: gosec.sarif
          retention-days: 14

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["go"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{ matrix.language }}"

  docker:
    name: Docker Build & SBOM
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: local/app:ci
          load: true

      - name: Generate SBOM
        uses: anchore/sbom-action@0b82b0b1a22399a1c542d4d656f70cd903571b5c # v0.21.1
        with:
          image: local/app:ci
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 14

  compliance:
    name: Compliance Bundle
    runs-on: ubuntu-latest
    needs: [build, security, docker]
    steps:
      - name: Download Binaries (all OS)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: binaries-*
          path: compliance/bin
          merge-multiple: true

      - name: Download Security Report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: security-report
          path: compliance/security

      - name: Download SBOM
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sbom
          path: compliance/sbom

      - name: Create compliance folder structure
        run: |
          mkdir -p compliance/docker
          mkdir -p compliance/docs

      - name: Save Docker Info
        run: |
          docker version > compliance/docker/docker-version.txt || true
          docker info > compliance/docker/docker-info.txt || true

      - name: Create Compliance Zip
        run: |
          cd compliance
          zip -r ../compliance-bundle.zip .

      - name: Upload Compliance Bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: compliance-bundle
          path: compliance-bundle.zip
          retention-days: 14

  # One check that stands for the whole workflow: it fails when any job failed or was
  # cancelled and passes when the rest succeeded or were skipped. Require this one in the
  # branch rules and the jobs above can change names or shape without a ruleset edit.
  ci-ok:
    name: CI result
    if: always()
    needs: [changes, test, coverage, lint, vuln, fips, fips-coverage, build, security, codeql, docker, compliance]
    runs-on: ubuntu-latest
    steps:
      - name: Check every job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
