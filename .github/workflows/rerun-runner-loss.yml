name: Rerun on runner loss

# GitHub sometimes never assigns a macOS runner and cancels the job after 15 minutes, with no
# steps run. That fails the required CI result through no fault of the code. This workflow
# reruns the failed jobs once, and only when every failure is such a job. A real test failure,
# a run cancelled by a newer push and a second attempt are all left alone.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  rerun:
    name: Rerun lost jobs once
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rerun when only never-started jobs failed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          counts=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate --jq '{
            lost: ([.jobs[] | select(.conclusion == "cancelled" and (.steps | length) == 0)] | length),
            real: ([.jobs[] | select((.conclusion == "failure" or .conclusion == "timed_out") and .name != "CI result")] | length)
          }')
          echo "$counts"
          lost=$(echo "$counts" | jq -s '[.[].lost] | add')
          real=$(echo "$counts" | jq -s '[.[].real] | add')
          if [ "$lost" -gt 0 ] && [ "$real" -eq 0 ]; then
            echo "Rerunning $lost job(s) that never received a runner."
            gh run rerun "$RUN_ID" --repo "$REPO" --failed
          else
            echo "Nothing to rerun: lost=$lost real=$real."
          fi
