name: License Scan

# Reusable: release.yml calls it before publishing. It also runs on every pull request
# so the release path is exercised long before a tag.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  license-scan:
    name: License Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.12'

    - name: Install ScanCode
      # Hash-locked for this runner (CPython 3.12, linux x86_64). Regenerate with:
      #   uv pip compile .github/requirements/scancode.in --generate-hashes --python-version 3.12 \
      #     --python-platform x86_64-manylinux_2_28 --no-header -o .github/requirements/scancode.txt
      run: pip install --require-hashes -r .github/requirements/scancode.txt

    - name: Scan repository for licenses and copyrights
      run: >
        scancode --license --copyright --package --info
        --ignore ".git/*" --ignore "THIRD_PARTY_NOTICES.md"
        --ignore "*check-license-scan.py"
        --processes 2 --json-pp scancode.json .

    - name: Fail on a foreign license or copyright in shipped code
      run: python3 scripts/check-license-scan.py scancode.json

    - name: Keep the scan result
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: license-scan
        path: scancode.json
