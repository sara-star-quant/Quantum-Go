name: Fuzz

# Deeper fuzzing than the seed corpora that the normal test jobs run. Weekly on main, on demand,
# and for a short run when a fuzz target or the script changes.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Time per target, for example 60s or 5m"
        default: "60s"
  pull_request:
    paths:
      - "**/*fuzz*_test.go"
      - "internal/kemtest/**"
      - "scripts/fuzz.sh"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: true

      # The fuzzing engine keeps what it learned in the Go build cache; keep it between runs so a
      # weekly run continues from the last one instead of starting from the seeds.
      - name: Restore the fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ runner.os }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ runner.os }}-

      - name: Fuzz
        env:
          FUZZTIME: ${{ github.event_name == 'pull_request' && '20s' || inputs.fuzztime || '60s' }}
          FUZZ_FILTER: ${{ github.event_name == 'pull_request' && 'MLKEMDifferential' || '^Fuzz' }}
        run: scripts/fuzz.sh

      - name: Save the fuzz corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ runner.os }}-${{ github.run_id }}

      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
