name: Mutation testing

# Measures how strong the tests are: a mutation tool changes the code one operator at a time and
# counts the changes the tests catch. A survivor is a change nothing noticed, and each one is a
# candidate for a new test. This is a report, not a gate: it is not part of ci-ok and sets no
# threshold until we have a baseline. Weekly on main, on demand, and as a cheap wiring check
# (dry run) when this file changes.
on:
  schedule:
    - cron: "0 5 * * 3"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/mutation.yml"

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        package: [pkg/protocol, pkg/crypto]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: true

      # Gremlins v0.6.0 (Apache-2.0, tag commit e05b1d4). go install checks the module against the
      # Go checksum database. It runs in this job only, with a read-only token and no secrets, and it
      # is not a dependency of the module.
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

      - name: Mutate
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          EVENT: ${{ github.event_name }}
        run: |
          mode=()
          if [ "$EVENT" = "pull_request" ]; then mode=(--dry-run); fi
          name=${PACKAGE//\//-}
          gremlins unleash "${mode[@]}" --workers 2 --timeout-coefficient 3 \
            --output "mutation-$name.json" "./$PACKAGE" 2>&1 | tee "mutation-$name.log"

      - name: Summarize
        if: always()
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          name=${PACKAGE//\//-}
          {
            echo "### Mutation: $PACKAGE"
            echo '```'
            tail -n 25 "mutation-$name.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ strategy.job-index }}
          path: mutation-*
          if-no-files-found: ignore
