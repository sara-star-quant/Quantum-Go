name: Stress changed tests

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*_test.go'
      - 'scripts/stress-changed-tests.sh'

permissions:
  contents: read

jobs:
  stress:
    name: Stress changed tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.x'
          cache: true
      - name: Run added and edited tests under load
        run: scripts/stress-changed-tests.sh "origin/${{ github.base_ref }}"
