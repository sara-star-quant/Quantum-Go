name: Stress changed tests

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*_test.go'
      - 'scripts/stress-changed-tests.sh'

permissions:
  contents: read

jobs:
  stress:
    name: Stress changed tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Run added and edited tests under load
        run: scripts/stress-changed-tests.sh "origin/${{ github.base_ref }}"
